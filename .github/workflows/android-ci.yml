name: android-ci

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-ci.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-ci.yml']

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Bawaan action masih memasang paket 'tools' yang sudah dihapus dari SDK.
          # Platform dan build-tools diunduh sendiri oleh AGP sesuai compileSdk.
          packages: 'platform-tools'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tulis local.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> local.properties
          echo "API_BASE_URL=${{ secrets.API_BASE_URL_STAGING }}" >> local.properties

      - name: Periksa gaya, lint, uji, lalu bangun APK
        run: ./gradlew --no-daemon spotlessCheck lintDebug testDebugUnitTest assembleDebug

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Unggah hasil lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14
