name: android-apk-rilis

on:
  push:
    tags: ['v*']
  workflow_dispatch:

defaults:
  run:
    working-directory: android

jobs:
  rilis:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tulis local.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> local.properties
          echo "API_BASE_URL=${{ secrets.API_BASE_URL_STAGING }}" >> local.properties

      - name: Bangun APK debug yang bisa langsung dipasang
        run: ./gradlew --no-daemon assembleDebug

      - name: Lampirkan APK ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
